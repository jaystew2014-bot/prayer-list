<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Prayer List</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&amp;family=Playfair+Display:ital,wght@0,600;0,700;1,500&amp;display=swap" rel="stylesheet"/>
<style>
  :root { --gold:#d9b25a; --gold-soft:#ecd9a6; --ink:#fff; --maroon:#4a0a16; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:100%; height:100%; overflow:hidden; background:#140308; }
  body { font-family:'Montserrat', Arial, sans-serif; color:var(--ink);
    background:
      radial-gradient(ellipse 70% 60% at 50% 45%, rgba(122,20,36,.55) 0%, rgba(74,10,22,.35) 45%, rgba(20,3,8,0) 80%),
      linear-gradient(180deg, #2a0610 0%, #1a040b 55%, #12030a 100%); }
  .glow { position:fixed; width:70vw; height:70vw; border-radius:50%; pointer-events:none; z-index:0;
    background:radial-gradient(circle, rgba(217,178,90,.10) 0%, rgba(217,178,90,0) 60%); will-change:transform; }
  .glow.a { top:-30vw; left:-20vw; animation:drift1 46s ease-in-out infinite alternate; }
  .glow.b { bottom:-35vw; right:-25vw; background:radial-gradient(circle, rgba(160,30,50,.22) 0%, rgba(160,30,50,0) 60%); animation:drift2 58s ease-in-out infinite alternate; }
  @keyframes drift1 { from { transform:translate(0,0); } to { transform:translate(18vw,12vh); } }
  @keyframes drift2 { from { transform:translate(0,0); } to { transform:translate(-16vw,-10vh); } }
  .frame { position:fixed; inset:2.2vh 1.6vw; border:1px solid rgba(217,178,90,.45); pointer-events:none; }
  .frame::after { content:''; position:absolute; inset:.9vh .6vw; border:1px solid rgba(217,178,90,.18); }

  header { position:fixed; top:5vh; left:0; right:0; text-align:center; z-index:3; }
  .church { color:var(--gold); font-weight:600; font-size:1.9vh; letter-spacing:.42em; text-transform:uppercase; }
  h1 { font-family:'Playfair Display', Georgia, serif; font-weight:700; font-size:7.2vh; line-height:1.1; margin-top:1.2vh; }
  .rule { display:flex; align-items:center; justify-content:center; gap:1.2vw; margin-top:1.6vh; }
  .rule span { width:9vw; height:1px; background:linear-gradient(90deg, transparent, var(--gold)); }
  .rule span:last-child { background:linear-gradient(270deg, transparent, var(--gold)); }
  .rule i { width:1vh; height:1vh; background:var(--gold); transform:rotate(45deg); }

  .view { position:fixed; top:23vh; bottom:16vh; left:0; right:0; overflow:hidden; z-index:2;
    -webkit-mask-image:linear-gradient(180deg, transparent 0, #000 10%, #000 88%, transparent 100%);
            mask-image:linear-gradient(180deg, transparent 0, #000 10%, #000 88%, transparent 100%); }
  .track { will-change:transform; }
  .track.static { position:absolute; top:50%; left:0; right:0; transform:translateY(-50%); }
  .copy { padding:6vh 0 4vh; text-align:center; }

  .group { margin-bottom:8vh; }
  .group h2 { display:flex; align-items:center; justify-content:center; gap:1.4vw;
    font-family:'Playfair Display', Georgia, serif; font-style:normal; font-weight:700; letter-spacing:.02em;
    color:var(--gold); font-size:6.8vh; margin-bottom:3.6vh; text-shadow:0 .3vh 1.2vh rgba(0,0,0,.35); }
  .group h2::before, .group h2::after { content:''; width:7vw; height:1px; background:rgba(217,178,90,.6); }
  .entry { margin-bottom:3.8vh; }
  .date { font-size:2.6vh; font-weight:600; letter-spacing:.32em; text-transform:uppercase; color:var(--gold); padding-bottom:1vh; }
  .name { font-weight:700; font-size:min(8vh, 5vw); letter-spacing:.04em; text-transform:uppercase; line-height:1.1; text-shadow:0 .3vh 1.2vh rgba(0,0,0,.4); }
  .sub { color:var(--gold-soft); font-weight:600; font-size:3.4vh; letter-spacing:.28em; text-transform:uppercase; margin:.5vh 0; }

  .empty { color:var(--gold-soft); font-family:'Playfair Display', Georgia, serif; font-style:italic; font-size:4.4vh; }

  footer { position:fixed; bottom:4.5vh; left:4vw; right:4vw; display:flex; align-items:flex-end; justify-content:space-between; z-index:3; }
  .add { display:flex; flex-direction:column; align-items:center; gap:1vh; }
  .qr { width:18vh; height:18vh; padding:1.2vh; background:#fff; border-radius:1vh; }
  .add p { font-size:2.4vh; line-height:1.3; color:rgba(255,255,255,.9); text-align:center; }
  .add b { color:var(--gold); font-weight:700; }
  .verse { text-align:right; font-family:'Playfair Display', Georgia, serif; font-style:italic; font-size:3.2vh; color:rgba(255,255,255,.9); }
  .verse small { display:block; margin-top:.4vh; font-family:'Montserrat', Arial, sans-serif; font-style:normal; font-size:2.1vh; letter-spacing:.3em; color:var(--gold); }
  @keyframes roll { from { transform:translateY(0); } to { transform:translateY(-50%); } }
</style>
</head>

<script>
(function () {

  var SMALL = { 'The Family of': 1, 'and Family': 1 };
  var current = '', pending = null;
  var track = document.getElementById('track'), view = document.getElementById('view');

  }

  function build(d) {
    if (d.church) document.getElementById('church').textContent = d.church;
    while (track.firstChild) track.removeChild(track.firstChild);
    track.style.animation = 'none';
    track.className = 'track';
    if (!d.groups || !d.groups.length) {
      track.className = 'track static';
      track.appendChild(el('div', 'empty', d.tagline || ''));
      return;
    }
    var first = block(d);
    track.appendChild(first);
    if (first.offsetHeight <= view.clientHeight) {      // fits: hold still, centered
      track.className = 'track static';
      return;
    }
    track.appendChild(block(d));                         // second copy for a seamless loop
    var speed = window.innerHeight * 0.045;              // pixels per second
    var secs = first.offsetHeight / speed;
    void track.offsetWidth;
    track.style.animation = 'roll ' + secs + 's linear infinite';
  }

  function receive(d) {
    var key = JSON.stringify(d);
    if (key === current) return;
    var moving = track.style.animation && track.style.animation !== 'none';
    if (!current || !moving) { current = key; build(d); return; }
    pending = d;                                         // swap at the end of the loop
  }
  track.addEventListener('animationiteration', function () {
    if (pending) { current = JSON.stringify(pending); build(pending); pending = null; }
  });

  var loading = null;
  window.__prayerData = function (d) { loading = null; receive(d); };
  function refresh() {
    if (loading) { try { loading.parentNode.removeChild(loading); } catch (e) {} }
    var s = document.createElement('script');
    s.src = SRC + '?callback=__prayerData&t=' + new Date().getTime();
    s.onerror = function () { loading = null; if (!current) setTimeout(refresh, 5000); };
    loading = s;
    document.getElementsByTagName('head')[0].appendChild(s);
  }

  function start() { refresh(); setInterval(refresh, REFRESH_MS); }
  function showDate() {
    var d = new Date();
    var days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    document.getElementById('today').textContent = days[d.getDay()] + ' \u00b7 ' + months[d.getMonth()] + ' ' + d.getDate();
  }
  showDate(); setInterval(showDate, 60000);
  start();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (current) build(JSON.parse(current)); });
  window.addEventListener('resize', function () { if (current) build(JSON.parse(current)); });
